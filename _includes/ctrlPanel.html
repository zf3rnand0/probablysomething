<div class="window glass active" id="ctrlPanel">
	<div class="title-bar  ctrlPanelTitlebar">
		<div class="title-bar-controls">
			<button aria-label="Minimize"></button>
			<button aria-label="Maximize"></button>
			<button aria-label="Close" id="ctrlPanelClose"></button>
		</div>
		<div class="ctrlPanelAddrbarHolder">
			<img src="/assets/images/icons/ctrlPanel/forward.png" style="transform: scale(-1, -1);">
			<img src="/assets/images/icons/ctrlPanel/forward.png" style="transform: scale(1, -1);">
			<div class="ctrlPanelAddrbar window-body">
				<img src="/assets/images/icons/ctrlPanel/ctrlPanel.png" id="CPABIcon">
				<p>Control Panel</p>
			</div>
			<div class="searchbox">
				<input type="search" placeholder="Search Control Panel"/>
				<button aria-label="search"></button>
			</div>
		</div>
	</div>
	<div class="window-body has-space">
		<section class="tabs">
			<menu role="tablist" aria-label="Control Panel Tabs">
				<button role="tab" aria-controls="general-tab" aria-selected="true">General</button>
			</menu>
			<article role="tabpanel" id="general-tab">
				<p>Set desktop background:</p>
				<select id="backgroundDropdown"></select>
				<button id="backgroundApplyBtn">Apply</button>
			</article>
		</section>
		<strong style="color: purple; margin:3px;">Use the "X" button to close the window!</strong>
	</div>
</div>
